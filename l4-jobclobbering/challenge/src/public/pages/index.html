<!DOCTYPE html>
<html lang='en'>

<head>
    <meta charset='UTF-8'>
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Baltimore Job Search</title>

    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.7.1/dist/leaflet.css" />

    <!-- Styles -->
    <link rel="stylesheet" href="static/styles/main.css" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.2.6/purify.min.js" integrity="sha512-YlctBG9PGZIhh9keoqI3eZkQM9T8QUbiBi7qNYAO/TUEo8jqWX5pLp5+x1cKRQDRzJ/lyGyJ9WUVNIRduxIIFw==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
</head>

<body>

    <div id="navbar">
        <a href="#" id="home">Home</a>
        <a href="#" id="about">About</a>
        <a href="#" id="contact">Contact</a>
        <div class="dropdown">
            <button class="dropbtn">Career Hub</button>
            <div class="dropdown-content">
                <a href="/redirect?url=https://www.apple.com/careers/">Apple</a>
                <a href="/redirect?url=https://www.amazon.jobs/">Amazon</a>
                <a href="/redirect?url=https://careers.google.com/">Google</a>
                <a href="/redirect?url=https://careers.microsoft.com/">Microsoft</a>
            </div>
        </div>
        <a href="#messages" id="messages">Messages</a>
    </div>

    <!-- README Section -->
    <div id="readmeSection">
        <h2 id="title">
            Find a job in Baltimore!
        </h2>
        <!-- Search Bar -->
        <div class="search-container">
            <form id="searchForm">
                <input type="text" id="searchInput" placeholder="Search for jobs...">
                <button type="submit" id="searchButton">Search</button>
            </form>
        </div>
        <!-- Search Results -->
        <div id="searchResults" class="search-results">
        </div>
    </div>


    <div id="content">
        <div class="container" id="mainboard">

        </div>
    </div>
    
    <!-- Job Submission Form Section -->
    <div id="submission-section">
        <div class="container">
            <div class="input-container">
                <h2>Help matching your dream job with our professional agents!</h2>
                <!-- Your input form -->
                <form id="locationForm" action="/submit" method="POST">
                    <label for="id">Name:</label>
                    <input type="text" id="id" name="id" placeholder="Jack" required>
                    
                    <label for="name">Job Title:</label>
                    <input type="text" id="name" name="title" placeholder="Software Engineer" required>
                    
                    <label for="AQ">Expected Salary:</label>
                    <input type="number" id="AQ" name="salary" placeholder="100000" required>
            
                    <label for="location">Preferred Location:</label>
                    <input type="text" id="location" name="location" placeholder="Baltimore" required>
            
                    <label for="phone">Phone Number:</label>
                    <input type="text" id="phone" name="phone" placeholder="123-456-7890" required>
            
                    <label for="url">Resume URL:</label>
                    <input type="text" id="url" name="url" placeholder="https://example.com/resume" required>
            
                    <input type="submit" value="Submit">
                </form>
            </div>
        </div>
    </div>
    <footer>
        <p>Copyright &copy; 2025 Baltimore Job Search</p>
    </footer>
    <script src="static/js/utils.js"></script>
</body>

</html>
